<body>
<div class="aura" aria-hidden="true"><i></i><i></i><i></i></div>

<main id="main">
<section class="give-page">
  <a class="give-mark" href="/" aria-label="ASJ Tweaks"><img src="/assets/brand/logo.svg" alt="" width="84" height="84"></a>
  <h1 class="give-title">Thank you!</h1>
  <p class="give-lead">Want your name on the supporters list? Add it below - it shows once it is approved.</p>
  <form class="give-list give-form" data-supporter-form>
    <label>Name<input name="name" maxlength="40" required autocomplete="nickname"></label>
    <label>Account (optional)<select name="net"><option value="">No link</option><option value="x">X</option><option value="telegram">Telegram</option><option value="instagram">Instagram</option></select></label>
    <label data-handle hidden>Username<input name="handle" maxlength="40" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="@username"></label>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="btn primary block" type="submit">Add my name</button>
    <p class="give-msg" data-msg role="status"></p>
  </form>
  <p class="give-note"><a href="/donate/">Back to the supporters</a></p>
</section>
</main>
