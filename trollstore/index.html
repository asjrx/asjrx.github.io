<!doctype html>
<meta charset="utf-8">
<title>ASJ Tweaks for TrollStore</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  This used to BE the ASJTikTok hand-off. It is the index now, because the name was always general
  and the link was not: one tweak per folder beside this file, each one a copy of the same page
  with a different FILE line. Adding a tweak is copying a folder.

  Every published link to /trollstore still lands here and still reaches the file in one more tap,
  which is why this page was not simply repointed.
-->
<style>
  :root { color-scheme: light dark; --bg:#f5f5f5; --fg:#000; --card:#fff; --dim:#6b6b6b;
          --line:rgba(0,0,0,.08); --accent:#10a2c5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --fg:#e6e6e6; --card:#141414; --dim:#8c8c8c; --line:rgba(255,255,255,.1); }
  }
  * { box-sizing: border-box; }
  body { font: 16px/1.55 -apple-system, system-ui, sans-serif; margin: 0; min-height: 100vh;
         display: grid; place-items: center; padding: 28px; background: var(--bg); color: var(--fg); }
  main { width: 100%; max-width: 380px; text-align: center; }
  h1 { font-size: 1.25rem; margin: 0 0 .15rem; letter-spacing: -.01em; }
  .tag { color: var(--dim); font-size: .92rem; margin: 0 0 1.6rem; }
  .row { display: flex; align-items: center; gap: 12px; text-align: start; text-decoration: none;
         color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
         padding: 14px 16px; margin-bottom: 10px; }
  .row b { display: block; font-size: 1rem; }
  .row span { display: block; color: var(--dim); font-size: .85rem; }
  .row .go { margin-inline-start: auto; color: var(--accent); font-weight: 600; font-size: .9rem; }
  .note { color: var(--dim); font-size: .82rem; margin-top: 1.4rem; }
  .note a { color: var(--accent); }
</style>
<main>
  <h1>ASJ Tweaks</h1>
  <p class="tag">Apps made easier</p>

  <a class="row" href="/trollstore/tiktok">
    <div>
      <b>ASJTikTok</b>
      <span>Privacy, download and playback options for TikTok</span>
    </div>
    <div class="go">Install</div>
  </a>

  <p class="note">Open this on the iPhone that has TrollStore — the file is handed straight to it.<br>
    Jailbroken instead? Add <a href="https://asjrx.github.io">asjrx.github.io</a> in Sileo, Zebra or Cydia.</p>
</main>
